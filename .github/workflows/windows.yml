name: Windows build

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build
        shell: powershell
        run: .\build.ps1
      - name: Test
        shell: powershell
        run: .\test.ps1
      - name: Upload Windows package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: QTL-Cartographer-Windows-x64
          path: |
            build/QTL-Cartographer-v*-Windows-x64.zip
            build/QTL-Cartographer-v*-Windows-x64.zip.sha256
